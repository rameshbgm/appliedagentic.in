0">1</tspan></text><text x="32" y="505" fill="#f2f5fa" font-size="17" font-weight="600" font-family="Arial, sans-serif"><tspan x="32" dy="0">User request</tspan></text><rect x="353.3333333333333" y="387" width="160" height="96" rx="16" fill="#15263d" stroke="#53d8ed" stroke-width="2"/><circle cx="433.3333333333333" cy="387" r="15" fill="#53d8ed"/><text x="428.3333333333333" y="392" fill="#09111e" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="428.3333333333333" dy="0">2</tspan></text><text x="365.3333333333333" y="425" fill="#f2f5fa" font-size="17" font-weight="600" font-family="Arial, sans-serif"><tspan x="365.3333333333333" dy="0">Conversation</tspan></text><rect x="686.6666666666666" y="467" width="160" height="96" rx="16" fill="#15263d" stroke="#53d8ed" stroke-width="2"/><circle cx="766.6666666666666" cy="467" r="15" fill="#53d8ed"/><text x="761.6666666666666" y="472" fill="#09111e" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="761.6666666666666" dy="0">3</tspan></text><text x="698.6666666666666" y="505" fill="#f2f5fa" font-size="17" font-weight="600" font-family="Arial, sans-serif"><tspan x="698.6666666666666" dy="0">Fixed workflow</tspan></text><rect x="1020" y="387" width="160" height="96" rx="16" fill="#15263d" stroke="#53d8ed" stroke-width="2"/><circle cx="1100" cy="387" r="15" fill="#53d8ed"/><text x="1095" y="392" fill="#09111e" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="1095" dy="0">4</tspan></text><text x="1032" y="425" fill="#f2f5fa" font-size="17" font-weight="600" font-family="Arial, sans-serif"><tspan x="1032" dy="0">Bounded agent</tspan></text><text x="60" y="665" fill="#c6d2e3" font-size="21" font-weight="400" font-family="Arial, sans-serif"><tspan x="60" dy="0">Choose an execution architecture according to task uncertainty and required authority.</tspan></text><text x="60" y="765" fill="#8ca2bf" font-size="15" font-weight="400" font-family="Arial, sans-serif"