8ed"/><text x="95" y="472" fill="#09111e" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="95" dy="0">1</tspan></text><text x="32" y="505" fill="#f2f5fa" font-size="17" font-weight="600" font-family="Arial, sans-serif"><tspan x="32" dy="0">Support request</tspan></text><rect x="270" y="387" width="160" height="96" rx="16" fill="#15263d" stroke="#53d8ed" stroke-width="2"/><circle cx="350" cy="387" r="15" fill="#53d8ed"/><text x="345" y="392" fill="#09111e" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="345" dy="0">2</tspan></text><text x="282" y="425" fill="#f2f5fa" font-size="17" font-weight="600" font-family="Arial, sans-serif"><tspan x="282" dy="0">Policy retrieval</tspan></text><rect x="520" y="467" width="160" height="96" rx="16" fill="#15263d" stroke="#53d8ed" stroke-width="2"/><circle cx="600" cy="467" r="15" fill="#53d8ed"/><text x="595" y="472" fill="#09111e" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="595" dy="0">3</tspan></text><text x="532" y="505" fill="#f2f5fa" font-size="17" font-weight="600" font-family="Arial, sans-serif"><tspan x="532" dy="0">Order lookup</tspan></text><rect x="770" y="387" width="160" height="96" rx="16" fill="#15263d" stroke="#53d8ed" stroke-width="2"/><circle cx="850" cy="387" r="15" fill="#53d8ed"/><text x="845" y="392" fill="#09111e" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="845" dy="0">4</tspan></text><text x="782" y="425" fill="#f2f5fa" font-size="17" font-weight="600" font-family="Arial, sans-serif"><tspan x="782" dy="0">Evidence check</tspan></text><rect x="1020" y="467" width="160" height="96" rx="16" fill="#15263d" stroke="#53d8ed" stroke-width="2"/><circle cx="1100" cy="467" r="15" fill="#53d8ed"/><text x="1095" y="472" fill="#09111e" font-size="15" font-weight="700" font-family="Arial, sans-serif"><tspan x="1095" dy="0">5</tspan></text><text x="1032" y="505" fill="#f2f5fa" font-size="17" font-weight="600